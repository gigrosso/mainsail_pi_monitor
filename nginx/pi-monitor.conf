# Mainsail Pi Monitor — snippet for the server{} block of Mainsail's Nginx site
# (usually /etc/nginx/sites-available/mainsail). install.sh inserts it automatically.
# It must stay at server level: a sub_filter inside "location /" would replace (not add to)
# any other sub_filter inherited from the server block.

    # --- mainsail-pi-monitor (begin) ---
    sub_filter '</head>' '<script src="/pi-monitor.js" defer></script></head>';

    location = /pi-monitor.js {
        alias /usr/local/share/mainsail-pi-monitor/pi-monitor.js;
        add_header Cache-Control "no-cache";
    }
    # --- mainsail-pi-monitor (end) ---
